name: Deploy a GitHub Pages desde Release

on:
  push:
    branches: ["main"] # Cambia a "master" si tu rama principal se llama master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Descargar, descomprimir y forzar Pantalla Completa Total
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Descargar archivo ZIP de la Release v1.0
          gh release download v1.0 -p "*.zip"
          mv *.zip juego.zip
          
          # 2. Descomprimir
          unzip -o juego.zip -d .
          
          # 3. Mover archivos a la raiz si quedaron dentro de subcarpetas
          find . -mindepth 2 -type f -exec mv {} . \;
          
          # 4. Inyectar CSS que fuerza al juego a ocupar el 100% de la pantalla sin franjas negras
          python3 -c '
          import os
          if os.path.exists("index.html"):
              with open("index.html", "r", encoding="utf-8") as f:
                  content = f.read()
              
              full_screen_css = """
              <style>
                html, body {
                  width: 100% !important;
                  height: 100% !important;
                  height: 100dvh !important;
                  margin: 0 !important;
                  padding: 0 !important;
                  overflow: hidden !important;
                  background-color: #000000 !important;
                  position: fixed !important;
                  top: 0 !important;
                  left: 0 !important;
                }
                #canvas, canvas {
                  width: 100vw !important;
                  height: 100dvh !important;
                  position: fixed !important;
                  top: 0 !important;
                  left: 0 !important;
                  object-fit: fill !important;
                  display: block !important;
                }
              </style>
              """
              if "</head>" in content:
                  new_content = content.replace("</head>", full_screen_css + "\n</head>")
              else:
                  new_content = full_screen_css + content
                  
              with open("index.html", "w", encoding="utf-8") as f:
                  f.write(new_content)
          '
          
          # 5. Limpieza
          rm -f juego.zip

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
