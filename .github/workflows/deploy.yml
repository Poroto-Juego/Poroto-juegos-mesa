name: Deploy a GitHub Pages desde Release

on:
  push:
    branches: ["main"] # Cambia a "master" si tu rama principal se llama master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Descargar y descomprimir juego desde Release
        run: |
          curl -L "https://github.com/Poroto-Juego/Poroto-Juego/releases/download/v1.0/Poroto.Web.zip" -o juego.zip
          unzip -o juego.zip -d .
          rm juego.zip

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

