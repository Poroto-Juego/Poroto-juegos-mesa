name: Deploy a GitHub Pages desde Release

on:
  push:
    branches: ["main"] # Cambia a "master" si tu rama se llama master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Descargar y desplegar Release directamente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Descargar el .zip de la release v1.0
          gh release download v1.0 -p "*.zip" -O juego.zip
          
          # 2. Descomprimir archivos tal como los genera Godot
          unzip -o juego.zip -d .
          
          # 3. Mover archivos a la raíz si cayeron en una carpeta interna
          if [ ! -f "index.html" ]; then
            find . -mindepth 2 -type f -exec mv {} . \;
          fi
          
          # 4. Limpieza del zip
          rm -f juego.zip

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
