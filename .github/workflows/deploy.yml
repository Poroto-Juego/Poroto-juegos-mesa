name: Deploy a GitHub Pages desde Release

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Descargar y preparar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf sitio juego.zip
          mkdir sitio

          gh release download v1.0 -p "*.zip" -O juego.zip

          unzip -o juego.zip -d sitio

          if [ -f "sitio/index.html" ]; then
            echo "Exportación encontrada directamente en la raíz del ZIP."
          else
            INDEX_PATH=$(find sitio -type f -name "index.html" -print -quit)

            if [ -z "$INDEX_PATH" ]; then
              echo "ERROR: No se encontró index.html dentro del ZIP."
              exit 1
            fi

            INDEX_DIR=$(dirname "$INDEX_PATH")

            echo "index.html encontrado en: $INDEX_DIR"

            if [ "$INDEX_DIR" != "sitio" ]; then
              cp -R "$INDEX_DIR"/. sitio/
            fi
          fi

          rm -f juego.zip

      - name: Inyectar SDKs de Telegram y AdsGram
        run: |
          if [ -f "sitio/index.html" ]; then
            sed -i 's|<head>|<head>\n    <script src="https://telegram.org/js/telegram-web-app.js"></script>\n    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>|g' sitio/index.html
            echo "SDKs de Telegram y AdsGram inyectados correctamente en sitio/index.html"
          else
            echo "ERROR: No se pudo inyectar los SDKs porque no existe sitio/index.html"
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "sitio"

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
