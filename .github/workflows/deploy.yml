name: Deploy a GitHub Pages desde Release

on:
  push:
    branches: ["main"] # Cambia a "master" si tu rama principal se llama master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Descargar, descomprimir y crear contenedor Iframe escalado (Estilo itch.io)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Descargar el archivo .zip de la Release v1.0
          gh release download v1.0 -p "*.zip"
          mv *.zip juego.zip
          
          # 2. Descomprimir
          unzip -o juego.zip -d .
          
          # 3. Mover archivos a la raiz si quedaron dentro de alguna subcarpeta
          find . -mindepth 2 -type f -exec mv {} . \;
          
          # 4. Renombrar el index.html original de Godot a game.html
          if [ -f "index.html" ]; then
            mv index.html game.html
          fi

          # 5. Crear contenedor con resolucion interna fija de 720x1280 y escalado CSS
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>Poroto</title>
            <style>
              * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
              }
              html, body {
                width: 100vw;
                height: 100vh;
                background-color: #000000;
                overflow: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
              }
              #container {
                width: 720px;
                height: 1280px;
                transform-origin: center center;
              }
              iframe {
                width: 720px;
                height: 1280px;
                border: none;
                display: block;
              }
            </style>
          </head>
          <body>
            <div id="container">
              <iframe src="game.html" allow="autoplay; fullscreen"></iframe>
            </div>
            <script>
              function scaleGame() {
                const container = document.getElementById('container');
                const scaleX = window.innerWidth / 720;
                const scaleY = window.innerHeight / 1280;
                const scale = Math.min(scaleX, scaleY);
                container.style.transform = `scale(${scale})`;
              }
              window.addEventListener('resize', scaleGame);
              window.addEventListener('load', scaleGame);
              scaleGame();
            </script>
          </body>
          </html>
          EOF
          
          # 6. Limpieza
          rm -f juego.zip

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
