name: Deploy a GitHub Pages desde ZIP en Drive

on:
  push:
    branches: ["main"] # Si tu rama principal se llama master, cambia "main" por "master"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Descargar y descomprimir juego desde Google Drive
        run: |
          pip install gdown
          
          # 1. Descarga el archivo ZIP desde Google Drive
          gdown --id "https://drive.google.com/uc?id=1mpQeRhsXgtDzg-evC7cwjutf3sFUbkm1/view?usp=drivesdk" -O juego.zip
          
          # 2. Descomprime todo el contenido en la carpeta principal
          unzip -o juego.zip -d .
          
          # 3. Borra el archivo zip pesado para que no ocupe espacio innecesario
          rm juego.zip

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
